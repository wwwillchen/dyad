name: Claude Check Workflows

on:
  schedule:
    # Daily at 13:00 UTC (5 AM PST / 6 AM PDT)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Number of hours to look back for workflow runs"
        required: false
        default: "24"
        type: string

jobs:
  check-workflows:
    environment: ai-bots
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    permissions:
      contents: read # checkout repository
      issues: write # create issues for workflow failures
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DYAD_GITHUB_APP_ID }}
          private-key: ${{ secrets.DYAD_GITHUB_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-issues: write

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-dyad

      - name: Check workflow health
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # Claude Code 2.1.280
        env:
          ANTHROPIC_BASE_URL: http://100.73.172.24:8081
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.UNDERCLASS_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 48000
        with:
          anthropic_api_key: ${{ secrets.UNDERCLASS_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: --model claude-opus-5-5
          display_report: true
          prompt: |
            /dyad:check-workflows ${{ inputs.hours || '24' }}
      - name: Cleanup (self-hosted macOS)
        if: always()
        run: bash scripts/ci-cleanup-macos.sh
